{% extends "products/base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<section class="card">
    <h1>{{ title }}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="actions">
            <button class="button" type="submit">Save</button>
            <a class="button secondary" href="{% url 'product_list' %}">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
