{% extends "products/base.html" %}
{% block title %}Delete product{% endblock %}
{% block content %}
<section class="card">
    <h1>Delete product</h1>
    <p>Are you sure you want to delete <strong>{{ product.name }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <div class="actions">
            <button class="button danger" type="submit">Yes, delete</button>
            <a class="button secondary" href="{% url 'product_list' %}">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
