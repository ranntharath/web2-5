<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Product CRUD{% endblock %}</title>
    <style>
        :root { font-family: Arial, sans-serif; color: #1f2937; background: #f3f4f6; }
        body { margin: 0; }
        main { max-width: 900px; margin: 48px auto; padding: 0 20px; }
        .card { background: white; padding: 24px; border-radius: 10px; box-shadow: 0 2px 10px #0001; }
        .header { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 20px; }
        h1 { margin: 0; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; border-bottom: 1px solid #e5e7eb; text-align: left; }
        th { background: #f9fafb; }
        .button { display: inline-block; border: 0; border-radius: 6px; padding: 9px 14px; color: white; background: #2563eb; text-decoration: none; cursor: pointer; }
        .secondary { background: #6b7280; }
        .danger { background: #dc2626; }
        .actions { display: flex; gap: 8px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; }
        input { box-sizing: border-box; width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; }
        form p { margin: 0 0 18px; }
        .errorlist { color: #b91c1c; }
        .message { padding: 12px; margin-bottom: 16px; border-radius: 6px; background: #dcfce7; color: #166534; }
        .empty { text-align: center; color: #6b7280; padding: 28px; }
    </style>
</head>
<body>
<main>
    {% for message in messages %}<div class="message">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
