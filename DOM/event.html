<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>


    <form class="w-50 mx-auto bg-info p-4">
        <h1>Register</h1>

        <label for="code">Code</label>
        <input class="form-control" id="code" type="number">
        
        <label class="form-label" for="name">Name</label>
        <input  class="form-control" id="name"  type="text">

        <label class="form-label" for="price">Price</label>
        <input type="number" id="price" class="form-control">

        <label class="form-label" for="stock">Stock</label>
        <input type="number" id="stock" class="form-control">

        <button id="add" type="submit" class="btn btn-primary mt-3 w-100">add</button>
        <button id="update" type="button" class="btn btn-success mt-3 w-100">Update</button>

        
    </form>

    <table class="table w-50 m-auto mt-5 table-bordered">
        <thead>
            <tr>
                <th>Code</th>
                <th>Name</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="table-body">
            
        
        </tbody>
    </table>
    
</body>
<script>
    const code = document.getElementById("code");
    const name = document.getElementById("name");
    const price = document.getElementById("price");
    const stock = document.getElementById("stock");

    const addBtn = document.getElementById("add");
    const updateBtn = document.getElementById("update");
    const tableBody = document.getElementById("table-body")

    
    let codeToEdit = null

    const products = []

    addBtn.addEventListener("click", function (e) {
        e.preventDefault();

        const codeValue = code.value;
        const nameValue = name.value;
        const priceValue = price.value;
        const stockValue = stock.value;

        if (codeValue == "" || nameValue == "" || priceValue == "" || stockValue == "") {
            alert("Please fill all fields");
            return;
        }

        const product = {
            code: codeValue,
            name: nameValue,
            price: priceValue,
            stock: stockValue
        }

        products.push(product);

        let tableRows = products.map((p) => {
            return  `
                <tr>

                    <td>${p.code}</td>
                    <td>${p.name}</td>
                    <td>${p.price}</td>
                    <td>${p.stock}</td>
                    <td>
                        <button data-code="${p.code}" onclick="deleteProduct(this)" class="btn btn-danger btn-sm delete-btn">Delete</button>
                        <button data-code="${p.code}" onclick="editProduct(this)" class="btn btn-warning btn-sm">Edit</button>
                    </td>
                    
                </tr>
            `
        })
        tableBody.innerHTML = tableRows.join("")
        code.value = ""
        name.value = ""
        price.value = ""
        stock.value = ""

        

    });
    function deleteProduct(e) {
        
       const deleteCode = e.getAttribute("data-code");
        
       const deleteIndex = products.findIndex(p => p.code === deleteCode);
       products.splice(deleteIndex, 1);


       let tableRows = products.map((p) => {
            return  `
                <tr>

                    <td>${p.code}</td>
                    <td>${p.name}</td>
                    <td>${p.price}</td>
                    <td>${p.stock}</td>
                    <td>
                        <button data-code="${p.code}" onclick="deleteProduct(this)" class="btn btn-danger btn-sm delete-btn">Delete</button>
                        <button data-code="${p.code}" onclick="editProduct(this)" class="btn btn-warning btn-sm">Edit</button>
                    </td>
                    
                </tr>
            `
        })
        tableBody.innerHTML = tableRows.join("")

    }

    function editProduct(e){
        const editCode =  e.getAttribute("data-code");
        console.log(editCode);

        const productToEdit = products.find(p => p.code === editCode);
        
        code.value = productToEdit.code;
        name.value = productToEdit.name;
        price.value = productToEdit.price;
        stock.value = productToEdit.stock;

        codeToEdit = editCode;
    }
    updateBtn.addEventListener("click", function(e){

        if(codeToEdit === null) return;

        const editCode = code.value;
        const editName = name.value;
        const editPrice = price.value;
        const editStock = stock.value;

        if (editCode == "" || editName == "" || editPrice == "" || editStock == "") {
            alert("Please fill all fields");
            return;
        }
        
        products.forEach( p=>{
            if(p.code == codeToEdit){
                
                p.code = editCode;
                p.name = editName;
                p.price = editPrice;
                p.stock = editStock;
            }
        })

        codeToEdit = null;
        let tableRows = products.map((p) => {
            return  `
                <tr>

                    <td>${p.code}</td>
                    <td>${p.name}</td>
                    <td>${p.price}</td>
                    <td>${p.stock}</td>
                    <td>
                        <button data-code="${p.code}" onclick="deleteProduct(this)" class="btn btn-danger btn-sm delete-btn">Delete</button>
                        <button data-code="${p.code}" onclick="editProduct(this)" class="btn btn-warning btn-sm">Edit</button>
                    </td>
                    
                </tr>
            `
        })
        tableBody.innerHTML = tableRows.join("")

        code.value = ""
        name.value = ""
        price.value = ""
        stock.value = ""
    })
    

</script>
</html>
