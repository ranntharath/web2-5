<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container{
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: 100px 100px  100px;
            gap: 5px;
        }
        .box{
            background-color: rgb(66, 100, 14);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 50px;
            
        }
        .box1{
            grid-column: 1 / 3;
            /* grid-column-start:1 ;
            grid-column-end: 3; */
        }
        .box4{
            grid-column: 2/4;
            grid-row: 2/4;
        }
    </style>

</head>
<body>
    
    <div class="container">
        <div class="box box1">1</div>
        <div class="box ">2</div>
        <div class="box">3</div>
        <div class="box box4">4</div>
        <div class="box">5</div>
       
    </div>


    
</body>
</html>
