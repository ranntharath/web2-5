<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../style/login.css" />
  </head>
  <body>
    <form>
      <h2>Sign Up</h2>
      <input type="email" placeholder="Email" />
      <input type="password" placeholder="Password" />
      <input type="password" placeholder="Confirm Password" />
      <button class="sign-up-btn">Sign Up</button>

      <p style="color: gray">
        Already have an account? <span><a href="#">Login</a></span>
      </p>

      <div class="or">
        <hr size="1" />
        <p style="color: gray;">Or</p>
        <hr size="1" />
      </div>

      <div class="btn-cont">
        <button class="auth-btn">
            <img class="social-img" src="https://img.icons8.com/?size=100&id=118468&format=png&color=000000" alt="">
            <p>Login with Facebook</p>
        </button>
        <button class="google-btn">
            <img class="social-img" src="https://img.icons8.com/?size=100&id=17949&format=png&color=000000" alt="">
            <p>Login with Google</p>
        </button>
      </div>
    </form>
  </body>
</html>
