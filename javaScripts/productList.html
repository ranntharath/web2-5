<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      .product-card {
        width: 340px;
        background: white;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        transition: 0.3s;
      }

      .product-card:hover {
        transform: translateY(-8px);
      }

      .product-image {
        width: 100%;
        height: 220px;
        object-fit: cover;
      }

      .product-content {
        padding: 20px;
      }

      .category {
        display: inline-block;
        background: #2563eb;
        color: white;
        padding: 5px 10px;
        border-radius: 20px;
        font-size: 12px;
        margin-bottom: 10px;
      }

      .product-content h2 {
        margin-bottom: 8px;
        color: #222;
      }

      .brand {
        color: #666;
        margin-bottom: 12px;
      }

      .description {
        color: #555;
        font-size: 14px;
        line-height: 1.5;
        margin-bottom: 18px;
      }

      .price-section {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
      }

      .price {
        font-size: 24px;
        font-weight: bold;
        color: #16a34a;
      }

      .discount {
        background: crimson;
        color: white;
        padding: 5px 10px;
        border-radius: 6px;
        font-size: 13px;
      }

      .bottom {
        display: flex;
        justify-content: space-between;
        margin-bottom: 20px;
        color: #555;
      }

      button {
        width: 100%;
        padding: 12px;
        border: none;
        background: #2563eb;
        color: white;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
      }

      button:hover {
        background: #1d4ed8;
      }
      #card-cont{
        display: grid;
        grid-template-columns: repeat(4,1fr);
        gap        : 20px;
      }
  </style>
</head>
<body>

  <div  id="card-cont">
    
  </div>

</body>
<script src="productList.js"></script>
</html>
