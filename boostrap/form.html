<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <form class="bg-white border border-1 rounded-3 w-25 m-auto mt-5 p-3">
      <h3>Register From</h3>

      <div class="d-flex flex-column gap-3">
        <div>
          <label for="username" class="form-label">Username</label>
          <input
            class="form-control"
            id="username"
            type="text"
            placeholder="e.g. jonh"
          />
        </div>

        <div>
          <label for="gender" class="form-label">Gender</label>
          <select id="gender" class="form-select">
            <option value="" disabled selected>Select your gender</option>
            <option value="">male</option>
            <option value="">female</option>
            <option value="">other</option>
          </select>
        </div>  

        <div>
          <label for="email" class="form-label">Email</label>
          <input
            type="email"
            id="email"
            class="form-control"
            placeholder="example@gmail.com"
          />
        </div>

        <div>
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            id="password"
            class="form-control"
            placeholder="password"
          />
        </div>

        <div>
          <label for="cfpassword" class="form-label">Confirm Password</label>
          <input
            type="password"
            id="cfpassword"
            class="form-control"
            placeholder="Confirm password"
          />
        </div>

        <div class="form-check form-switch">
            <input type="checkbox" class="form-check-input" id="remember">
            <label for="remember" class="form-check-label">Remeber me</label>
        </div>

        <button class="btn btn-primary">Regsiter</button>
        <p class="text-secondary text-center">
          Already have an account ? <a href="#">login</a>
        </p>
      </div>
    </form>
  </body>
</html>
